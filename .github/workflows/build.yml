name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge-build:
    name: Forge build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge artifact
        run: ./gradlew :forge:build --no-daemon --stacktrace

      - name: Upload Forge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: powahextension-forge-${{ github.sha }}
          path: forge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
