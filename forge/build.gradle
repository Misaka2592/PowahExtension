plugins {
    id 'com.github.johnrengelman.shadow' version '7.0.0'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    modApi "dev.architectury:architectury-forge:${rootProject.architectury_api_version}"

    // Powah (vendored jar) + its runtime dependencies, so runClient boots with Powah installed.
    modImplementation "powah:powah-forge:${rootProject.powah_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_version}"

    // Dev-runtime QoL mods: JEI shows our recipes in-game, GuideME renders the guide,
    // ModernUI improves text rendering. None of these are compile-time dependencies.
    // NOTE: use the self-contained Modrinth JEI jar — the modmaven.dev artifacts are
    // split (forge jar misses the common classes at runtime).
    modRuntimeOnly "maven.modrinth:jei:${rootProject.jei_version}"
    modRuntimeOnly "maven.modrinth:guideme:${rootProject.guideme_version}"
    modRuntimeOnly "maven.modrinth:modern-ui:${rootProject.modernui_version}"
    modRuntimeOnly "maven.modrinth:guideme:${rootProject.guideme_version}"
    modRuntimeOnly "maven.modrinth:modern-ui:${rootProject.modernui_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionForge')) { transitive = false }
}

processResources {
    def buildProps = [
        mod_id         : rootProject.mod_id,
        mod_name       : rootProject.mod_name,
        mod_version    : rootProject.mod_version,
        mod_license    : rootProject.mod_license,
        mod_group      : rootProject.mod_group,
        minecraft_version: rootProject.minecraft_version,
        forge_version  : rootProject.forge_version,
    ]
    inputs.properties buildProps

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand buildProps
    }
}

shadowJar {
    exclude 'fabric.mod.json'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
