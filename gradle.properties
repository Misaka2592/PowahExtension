# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Mod
mod_id=powahextension
mod_name=PowahExtension
mod_version=1.1.0
mod_license=LGPL-3.0
# TODO: replace with your own group (e.g. io.github.<your-github-username>)
mod_group=io.github.misaka2592
archives_base_name=powahextension

# Minecraft / toolchain
minecraft_version=1.20.1
# Comma-separated platforms the common module compiles against (architectury-plugin)
enabled_platforms=forge

# Dependencies
forge_version=47.3.0
architectury_api_version=9.2.14
cloth_config_version=11.1.136
# Powah! Rearchitected. VENDORED as libs/powah-forge-<version>.jar: it is the Modrinth
# 5.0.10 forge jar with `architectury.common.json` REMOVED. That file references
# `powah.accesswidener` (not shipped in the jar -> crashes loom's AW processor), and the
# AW's intermediary namespace makes loom's forge mod remapper fail with
# "Namespace mismatch, expected srg got intermediary". We don't use the widened members,
# and Forge still applies META-INF/accesstransformer.cfg at runtime, so this is safe.
# Fabric port note: vendor maven.modrinth:powah:5.0.4-fabric as-is instead (no strip needed).
powah_version=5.0.10
