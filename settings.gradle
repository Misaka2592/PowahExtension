pluginManagement {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://files.minecraftforge.net/maven/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
    }
}

plugins {
    // Allows Gradle to provision a Java 17 toolchain automatically if the
    // local JDK is newer (Minecraft 1.20.1 targets Java 17).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

include 'common'
include 'forge'
// Portability: add `include 'fabric'` / `include 'neoforge'` here when porting.

rootProject.name = 'PowahExtension'
